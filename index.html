<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
  }
  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", monospace, sans-serif;
    color: #e0e8f5;
  }
  #canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }
  #canvas-container canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* HUD Overlays */
  .hud-overlay {
    position: absolute;
    z-index: 10;
    pointer-events: none;
  }

  .hud-header {
    top: 24px;
    left: 28px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    text-shadow: 0 0 15px rgba(255, 160, 40, 0.6);
  }
  .hud-title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .hud-title .badge {
    font-size: 9px;
    padding: 2px 7px;
    background: rgba(255, 120, 0, 0.25);
    border: 1px solid rgba(255, 150, 50, 0.5);
    border-radius: 4px;
    color: #ffaa55;
    letter-spacing: 0.15em;
  }
  .hud-subtitle {
    font-size: 11px;
    letter-spacing: 0.25em;
    color: rgba(200, 220, 255, 0.6);
    text-transform: uppercase;
  }

  /* Audio Activation Splash */
  #audio-gate {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(10, 5, 20, 0.85) 0%, rgba(0, 0, 0, 0.95) 100%);
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
    backdrop-filter: blur(8px);
  }
  #audio-gate.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .gate-ring {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: 2px dashed rgba(255, 170, 70, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
    animation: rotateRing 20s linear infinite;
    box-shadow: 0 0 35px rgba(255, 120, 20, 0.25), inset 0 0 25px rgba(255, 100, 0, 0.2);
    position: relative;
  }
  .gate-ring::after {
    content: '';
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    border: 1px solid rgba(255, 220, 160, 0.7);
    animation: pulseCore 2.4s ease-in-out infinite;
  }
  @keyframes rotateRing {
    to { transform: rotate(360deg); }
  }
  @keyframes pulseCore {
    0%, 100% { transform: scale(0.92); opacity: 0.5; }
    50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 10px #ff9922); }
  }
  .gate-icon {
    font-size: 40px;
    filter: drop-shadow(0 0 12px #ff8800);
  }
  .gate-text {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.3em;
    color: #fff;
    text-transform: uppercase;
    margin-bottom: 8px;
    text-shadow: 0 0 10px rgba(255, 150, 50, 0.8);
  }
  .gate-desc {
    font-size: 12px;
    color: rgba(210, 225, 255, 0.65);
    letter-spacing: 0.15em;
  }

  /* Interactive Control Bar */
  .hud-controls {
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
    pointer-events: auto;
    background: rgba(8, 12, 22, 0.65);
    border: 1px solid rgba(255, 170, 80, 0.2);
    padding: 10px 18px;
    border-radius: 36px;
    backdrop-filter: blur(16px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 120, 20, 0.1);
  }
  .btn-hud {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 160, 60, 0.25);
    color: #e5efff;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
  }
  .btn-hud:hover {
    background: rgba(255, 140, 30, 0.2);
    border-color: rgba(255, 180, 70, 0.6);
    color: #fff;
    box-shadow: 0 0 14px rgba(255, 120, 0, 0.4);
    transform: translateY(-1px);
  }
  .btn-hud:active {
    transform: translateY(1px);
  }
  .btn-hud.active {
    background: linear-gradient(135deg, rgba(255, 120, 20, 0.4), rgba(200, 30, 10, 0.4));
    border-color: #ff9933;
    color: #fff;
    box-shadow: 0 0 18px rgba(255, 120, 0, 0.5);
  }

  /* Telemetry Panel */
  .hud-stats {
    top: 24px;
    right: 28px;
    text-align: right;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: rgba(180, 210, 255, 0.7);
  }
  .stat-row {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .stat-val {
    color: #ffb055;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  /* Audio Waveform Canvas */
  #wave-canvas {
    width: 90px;
    height: 24px;
    display: block;
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.4);
  }

  /* Responsive tweaks */
  @media (max-width: 768px) {
    .hud-header { top: 16px; left: 16px; }
    .hud-title { font-size: 15px; }
    .hud-stats { display: none; }
    .hud-controls { bottom: 16px; width: 92%; justify-content: space-around; padding: 8px 12px; }
    .btn-hud { padding: 6px 10px; font-size: 10px; }
  }

<script>
(function() {
  // --- Audio Synthesis Engine ---
  let audioCtx = null;
  let isMuted = false;
  let masterGain = null;
  let analyser = null;
  let subOsc = null;
  let subGain = null;
  let droneOsc1 = null;
  let droneOsc2 = null;
  let noiseNode = null;
  let filterNode = null;
  let waveData = null;
  let audioVibrationLevel = 0.0;
  let warpPulseIntensity = 0.0;

  function initAudio() {
    if (audioCtx) return;
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContextClass();

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    analyser.smoothingTimeConstant = 0.8;
    waveData = new Uint8Array(analyser.frequencyBinCount);

    masterGain = audioCtx.createGain();
    masterGain.gain.setValueAtTime(0.7, audioCtx.currentTime);
    masterGain.connect(analyser);
    analyser.connect(audioCtx.destination);

    // 1. Deep Sub-Bass Rumble (Gravitational Core Frequency 38-50Hz)
    subOsc = audioCtx.createOscillator();
    subOsc.type = 'sine';
    subOsc.frequency.setValueAtTime(43.2, audioCtx.currentTime);

    subGain = audioCtx.createGain();
    subGain.gain.setValueAtTime(0.55, audioCtx.currentTime);
    subOsc.connect(subGain);
    subGain.connect(masterGain);
    subOsc.start();

    // Subtle LFO modulating sub frequency for deep cosmic throb
    const subLfo = audioCtx.createOscillator();
    subLfo.frequency.setValueAtTime(0.45, audioCtx.currentTime); // 0.45 Hz oscillation
    const subLfoGain = audioCtx.createGain();
    subLfoGain.gain.setValueAtTime(4.5, audioCtx.currentTime);
    subLfo.connect(subLfoGain);
    subLfoGain.connect(subOsc.frequency);
    subLfo.start();

    // 2. Dual Detuned Saw Drones (Accretion Plasma Shear & Doppler hum)
    droneOsc1 = audioCtx.createOscillator();
    droneOsc1.type = 'sawtooth';
    droneOsc1.frequency.setValueAtTime(86.4, audioCtx.currentTime); // 1st octave harmonic

    droneOsc2 = audioCtx.createOscillator();
    droneOsc2.type = 'sawtooth';
    droneOsc2.frequency.setValueAtTime(87.2, audioCtx.currentTime); // Beating detune

    // Lowpass filter with resonance to simulate space vacuum damping
    filterNode = audioCtx.createBiquadFilter();
    filterNode.type = 'lowpass';
    filterNode.frequency.setValueAtTime(260, audioCtx.currentTime);
    filterNode.Q.setValueAtTime(4.2, audioCtx.currentTime);

    const droneGain = audioCtx.createGain();
    droneGain.gain.setValueAtTime(0.25, audioCtx.currentTime);

    droneOsc1.connect(filterNode);
    droneOsc2.connect(filterNode);
    filterNode.connect(droneGain);
    droneGain.connect(masterGain);

    droneOsc1.start();
    droneOsc2.start();

    // Filter frequency sweeps slowly like interstellar dust clouds
    const filterLfo = audioCtx.createOscillator();
    filterLfo.frequency.setValueAtTime(0.18, audioCtx.currentTime);
    const filterLfoGain = audioCtx.createGain();
    filterLfoGain.gain.setValueAtTime(90, audioCtx.currentTime);
    filterLfo.connect(filterLfoGain);
    filterLfoGain.connect(filterNode.frequency);
    filterLfo.start();

    // 3. Cosmic Wind / High accretion turbulence noise
    const bufferSize = audioCtx.sampleRate * 2;
    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      output[i] = (Math.random() * 2 - 1) * 0.4;
    }
    noiseNode = audioCtx.createBufferSource();
    noiseNode.buffer = noiseBuffer;
    noiseNode.loop = true;

    const noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.setValueAtTime(420, audioCtx.currentTime);
    noiseFilter.Q.setValueAtTime(2.0, audioCtx.currentTime);

    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.12, audioCtx.currentTime);

    noiseNode.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(masterGain);
    noiseNode.start();
  }

  function triggerWarpPulse() {
    warpPulseIntensity = 1.0;
    if (audioCtx && audioCtx.state === 'running' && !isMuted) {
      // Gravitational chirp sound
      const now = audioCtx.currentTime;
      const chirpOsc = audioCtx.createOscillator();
      const chirpGain = audioCtx.createGain();
      chirpOsc.type = 'sine';
      chirpOsc.frequency.setValueAtTime(35, now);
      chirpOsc.frequency.exponentialRampToValueAtTime(320, now + 0.6);
      chirpGain.gain.setValueAtTime(0.6, now);
      chirpGain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
      chirpOsc.connect(chirpGain);
      chirpGain.connect(masterGain);
      chirpOsc.start(now);
      chirpOsc.stop(now + 1.0);

      // Temporary filter surge
      filterNode.frequency.cancelScheduledValues(now);
      filterNode.frequency.setValueAtTime(800, now);
      filterNode.frequency.exponentialRampToValueAtTime(260, now + 1.2);
    }
  }

  // --- Palettes ---
  const PALETTES = [
    { name: "INTERSTELLAR", id: 0 },
    { name: "QUANTUM VIOLET", id: 1 },
    { name: "SUPERNOVA CYAN", id: 2 },
    { name: "SINGULARITY DUAL", id: 3 }
  ];
  let currentPaletteIdx = 0;

  // --- Three.js & Raymarching Black Hole Shader Setup ---
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
  container.appendChild(renderer.domElement);

  // Black Hole Gravitational Lensing & Raymarching Fragment Shader
  const fragmentShader = `
    uniform vec2 u_resolution;
    uniform float u_time;
    uniform vec3 u_cam_pos;
    uniform vec3 u_cam_target;
    uniform float u_vibration;
    uniform float u_pulse;
    uniform int u_palette;

    #define PI 3.14159265359
    #define STEPS 64
    #define RS 1.0        // Schwarzschild radius
    #define RIN 1.8       // Inner disk edge (ISCO)
    #define ROUT 6.2      // Outer disk edge

    // Fast Pseudo-random noise
    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
    }

    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i + vec2(0.0,0.0)), hash(i + vec2(1.0,0.0)), u.x),
                 mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), u.x), u.y);
    }

    float fbm(vec2 p) {
      float v = 0.0;
      float a = 0.5;
      mat2 rot = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.5));
      for (int i = 0; i < 4; ++i) {
        v += a * noise(p);
        p = rot * p * 2.0 + vec2(100.0);
        a *= 0.5;
      }
      return v;
    }

    // Procedural Starfield with Background Gravitational Shear
    vec3 backgroundStars(vec3 dir, float warpRipple) {
      // Metric ripple distortion on background rays
      dir.xy += vec2(sin(dir.z * 18.0 + u_time * 3.0), cos(dir.z * 18.0 + u_time * 3.0)) * 0.015 * warpRipple;
      dir = normalize(dir);

      vec2 uv = vec2(atan(dir.z, dir.x), asin(clamp(dir.y, -1.0, 1.0)));
      float n = hash(floor(uv * 180.0));
      vec3 starCol = vec3(0.0);
      if (n > 0.985) {
        float b = pow((n - 0.985) / 0.015, 6.0) * (0.6 + 0.4 * sin(u_time * 6.0 + n * 40.0));
        starCol = vec3(b * 1.5) * mix(vec3(0.7, 0.85, 1.0), vec3(1.0, 0.8, 0.6), hash(uv));
      }

      // Distant cosmic dust & faint nebula ribbon
      float nebula = fbm(uv * 2.5 + vec2(u_time * 0.01));
      vec3 nebCol = mix(vec3(0.02, 0.04, 0.08), vec3(0.08, 0.03, 0.09), nebula) * smoothstep(0.3, 0.8, nebula);
      return starCol + nebCol;
    }

    // Palette Color Generator for Vibrating Accretion Disk
    vec3 getDiskPalette(float temp, float doppler, float vibe) {
      // temp: 0 to 1, doppler: ~0.4 to 1.8
      vec3 c = vec3(0.0);

      if (u_palette == 0) {
        // Classic Interstellar Incandescent Gold -> White Core -> Crimson Edge
        vec3 colCore = vec3(1.0, 0.95, 0.85);
        vec3 colMid  = vec3(1.0, 0.58, 0.12);
        vec3 colRim  = vec3(0.75, 0.12, 0.02);
        c = mix(colRim, colMid, smoothstep(0.0, 0.6, temp));
        c = mix(c, colCore, smoothstep(0.6, 1.0, temp));
        // Vibrating color shifts
        c += vec3(0.3 * sin(u_time * 4.0), 0.1 * cos(u_time * 5.0), 0.25 * sin(u_time * 3.0)) * vibe;
      } else if (u_palette == 1) {
        // Quantum Violet & Electric Magenta
        vec3 colCore = vec3(0.9, 0.95, 1.0);
        vec3 colMid  = vec3(0.7, 0.1, 0.9);
        vec3 colRim  = vec3(0.2, 0.02, 0.6);
        c = mix(colRim, colMid, smoothstep(0.0, 0.6, temp));
        c = mix(c, colCore, smoothstep(0.6, 1.0, temp));
        c.rg += 0.25 * vibe * vec2(sin(u_time * 8.0), cos(u_time * 7.0));
      } else if (u_palette == 2) {
        // Supernova Cyan & Pulsar Emerald
        vec3 colCore = vec3(0.95, 1.0, 1.0);
        vec3 colMid  = vec3(0.05, 0.85, 0.95);
        vec3 colRim  = vec3(0.01, 0.2, 0.6);
        c = mix(colRim, colMid, smoothstep(0.0, 0.5, temp));
        c = mix(c, colCore, smoothstep(0.5, 1.0, temp));
        c.g += 0.2 * vibe;
      } else {
        // Singularity Dual / Hyperspace Chromatic
        float hue = fract(temp * 0.9 + u_time * 0.15 + vibe * 0.4);
        c = 0.5 + 0.5 * cos(6.28318 * (vec3(1.0, 1.0, 1.0) * hue + vec3(0.0, 0.33, 0.67)));
        c = mix(c, vec3(1.2), smoothstep(0.7, 1.0, temp));
      }

      // Relativistic Doppler beaming amplification
      c *= pow(doppler, 3.2);
      return c;
    }

    void main() {
      vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution) / u_resolution.y;

      // Camera Matrix setup
      vec3 ro = u_cam_pos;
      vec3 forward = normalize(u_cam_target - ro);
      vec3 right = normalize(cross(forward, vec3(0.0, 1.0, 0.0)));
      vec3 up = cross(right, forward);

      // Camera vibration / shake from sound bass
      float shakeAmp = (u_vibration * 0.035 + u_pulse * 0.06);
      vec2 shake = vec2(sin(u_time * 37.0), cos(u_time * 43.0)) * shakeAmp;
      vec3 rd = normalize(forward * 1.55 + right * (uv.x + shake.x) + up * (uv.y + shake.y));

      // Space bending raymarching loop
      vec3 rayPos = ro;
      vec3 rayDir = rd;
      vec3 accumColor = vec3(0.0);
      float alpha = 0.0;
      bool hitHorizon = false;

      // Accretion disk tilt matrix: tilt slightly (e.g. 15 degrees) for stunning 3D depth
      float tiltAngle = 0.18;
      mat3 tiltMat = mat3(
        1.0, 0.0, 0.0,
        0.0, cos(tiltAngle), -sin(tiltAngle),
        0.0, sin(tiltAngle), cos(tiltAngle)
      );
      mat3 invTilt = mat3(
        1.0, 0.0, 0.0,
        0.0, cos(-tiltAngle), -sin(-tiltAngle),
        0.0, sin(-tiltAngle), cos(-tiltAngle)
      );

      float h = 0.16; // Integration step size
      float totalDist = 0.0;

      for (int i = 0; i < STEPS; i++) {
        float r = length(rayPos);

        // Check Event Horizon intersection
        if (r < RS * 1.02) {
          hitHorizon = true;
          break;
        }

        // Ray bending towards the black hole (Schwarzschild / Kerr deflection acceleration)
        // dÂ²x/dÎ»Â² = -1.5 * Rs * x / r^5
        float bendForce = 1.45 * RS / (r * r * r * r);
        // Modulate bending with spacetime ripple sound waves!
        float ripple = 1.0 + 0.35 * sin(r * 9.0 - u_time * 12.0) * (u_vibration + u_pulse * 1.5);
        vec3 accel = -rayPos * bendForce * ripple;

        vec3 prevPos = rayPos;
        rayDir = normalize(rayDir + accel * h);
        rayPos += rayDir * h;
        totalDist += h;

        // Dynamic step scaling: smaller steps near photon sphere, larger far away
        h = max(0.05, r * 0.045);

        // Transform ray segment into tilted accretion disk frame
        vec3 p0 = tiltMat * prevPos;
        vec3 p1 = tiltMat * rayPos;

        // Check if segment crosses disk plane y = 0
        if ((p0.y * p1.y) < 0.0) {
          float tPlane = -p0.y / (p1.y - p0.y);
          vec3 hitP = mix(p0, p1, tPlane);
          float diskRadius = length(hitP.xz);

          if (diskRadius >= RIN && diskRadius <= ROUT) {
            // Normalized radius within disk: 0 at inner edge, 1 at outer edge
            float normR = (diskRadius - RIN) / (ROUT - RIN);

            // Keplerian orbital speed for Doppler effect: v ~ 1 / sqrt(r)
            float phi = atan(hitP.z, hitP.x);
            float orbitSpeed = 0.55 * sqrt(RS / diskRadius);
            // Tangent velocity vector
            vec3 vDisk = vec3(-sin(phi), 0.0, cos(phi)) * orbitSpeed;
            // Ray direction in disk plane
            vec3 localDir = normalize(tiltMat * rayDir);
            float cosTheta = dot(localDir, normalize(vDisk));
            // Relativistic Doppler Factor
            float beta = length(vDisk);
            float doppler = sqrt(1.0 - beta * beta) / (1.0 - beta * cosTheta);

            // Swirling plasma noise pattern
            float swirlTime = u_time * (1.8 / sqrt(diskRadius));
            vec2 diskCoord = vec2(diskRadius * 3.5, phi * 4.0 - swirlTime);
            float plasmaNoise = fbm(diskCoord + vec2(fbm(diskCoord * 1.5)));

            // Sound vibration ripples traveling outward along the accretion disk
            float soundWave = sin(diskRadius * 14.0 - u_time * 8.0) * (u_vibration * 0.7 + u_pulse * 1.0);
            float intensity = smoothstep(0.0, 0.15, normR) * smoothstep(1.0, 0.6, normR);
            intensity *= (0.6 + 0.7 * plasmaNoise + 0.3 * soundWave);

            // Accretion temperature
            float temp = pow(1.0 - normR, 1.6) * (1.0 + 0.4 * soundWave);

            vec3 diskCol = getDiskPalette(temp, doppler, u_vibration + u_pulse);
            float diskDensity = clamp(intensity * 1.4, 0.0, 1.0);

            // Alpha blending (volumetric optical accumulation)
            accumColor += (1.0 - alpha) * diskCol * diskDensity * 1.8;
            alpha += (1.0 - alpha) * diskDensity;

            if (alpha > 0.96) break;
          }
        }
      }

      // Photon Sphere Ring Glow (r ~ 1.5 Rs)
      // When ray grazed near horizon, intense circular relativistic photon ring
      float minR = length(rayPos);
      if (!hitHorizon && minR < RS * 1.58 && minR > RS * 0.98) {
        float ringGlow = smoothstep(RS * 1.58, RS * 1.05, minR);
        vec3 ringColor = getDiskPalette(0.85, 1.0, u_vibration) * 2.2;
        accumColor += (1.0 - alpha) * ringColor * ringGlow * 0.7;
        alpha += (1.0 - alpha) * ringGlow * 0.5;
      }

      // Background Starfield if ray escapes to infinity
      vec3 finalColor = vec3(0.0);
      if (hitHorizon) {
        // Pure black singularity horizon inside photon ring
        finalColor = accumColor;
      } else {
        vec3 bgStars = backgroundStars(rayDir, u_vibration * 1.2 + u_pulse * 2.0);
        finalColor = accumColor + (1.0 - alpha) * bgStars;
      }

      // Gravitational Wave Chromatic Aberration & Lens Flare post-effect
      float rDist = length(uv);
      float caAmount = (u_vibration * 0.015 + u_pulse * 0.04) * smoothstep(0.1, 0.8, rDist);
      vec3 ca = vec3(
        finalColor.r * (1.0 + caAmount),
        finalColor.g,
        finalColor.b * (1.0 - caAmount)
      );

      // Vignette & Contrast grading
      float vig = 1.0 - 0.28 * dot(uv, uv);
      vec3 toneMapped = ca / (ca + vec3(1.0)); // Reinhard tonemap
      toneMapped = pow(toneMapped * vig, vec3(0.92)); // Gamma correction

      gl_FragColor = vec4(toneMapped, 1.0);
    }
  `;

  const vertexShader = `
    void main() {
      gl_Position = vec4(position, 1.0);
    }
  `;

  // Shader Uniforms
  const uniforms = {
    u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    u_time: { value: 0.0 },
    u_cam_pos: { value: new THREE.Vector3(0.0, 1.2, -6.8) },
    u_cam_target: { value: new THREE.Vector3(0.0, 0.0, 0.0) },
    u_vibration: { value: 0.0 },
    u_pulse: { value: 0.0 },
    u_palette: { value: 0 }
  };

  const material = new THREE.ShaderMaterial({
    vertexShader: vertexShader,
    fragmentShader: fragmentShader,
    uniforms: uniforms,
    depthWrite: false,
    depthTest: false
  });

  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
  scene.add(quad);

  // --- Orbit Camera Controls ---
  let camRadius = 6.8;
  let camTheta = -Math.PI * 0.5; // Yaw
  let camPhi = 0.22;             // Pitch
  let isDragging = false;
  let prevMouseX = 0;
  let prevMouseY = 0;

  function updateCameraPosition() {
    camPhi = Math.max(-1.45, Math.min(1.45, camPhi));
    camRadius = Math.max(3.2, Math.min(14.0, camRadius));
    const x = camRadius * Math.cos(camPhi) * Math.sin(camTheta);
    const y = camRadius * Math.sin(camPhi);
    const z = camRadius * Math.cos(camPhi) * Math.cos(camTheta);
    uniforms.u_cam_pos.value.set(x, y, z);
  }
  updateCameraPosition();

  // Mouse / Touch Event Listeners
  window.addEventListener('mousedown', (e) => {
    if (e.target.closest('.hud-controls') || e.target.closest('#audio-gate')) return;
    isDragging = true;
    prevMouseX = e.clientX;
    prevMouseY = e.clientY;
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - prevMouseX;
    const dy = e.clientY - prevMouseY;
    prevMouseX = e.clientX;
    prevMouseY = e.clientY;

    camTheta += dx * 0.006;
    camPhi -= dy * 0.006;
    updateCameraPosition();
  });

  window.addEventListener('mouseup', () => { isDragging = false; });

  // Touch Support
  let touchStartDist = 0;
  window.addEventListener('touchstart', (e) => {
    if (e.target.closest('.hud-controls') || e.target.closest('#audio-gate')) return;
    if (e.touches.length === 1) {
      isDragging = true;
      prevMouseX = e.touches[0].clientX;
      prevMouseY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
      isDragging = false;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      touchStartDist = Math.hypot(dx, dy);
    }
  }, { passive: false });

  window.addEventListener('touchmove', (e) => {
    if (e.target.closest('.hud-controls') || e.target.closest('#audio-gate')) return;
    if (e.touches.length === 1 && isDragging) {
      const dx = e.touches[0].clientX - prevMouseX;
      const dy = e.touches[0].clientY - prevMouseY;
      prevMouseX = e.touches[0].clientX;
      prevMouseY = e.touches[0].clientY;

      camTheta += dx * 0.007;
      camPhi -= dy * 0.007;
      updateCameraPosition();
    } else if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      const delta = touchStartDist - dist;
      touchStartDist = dist;
      camRadius += delta * 0.02;
      updateCameraPosition();
    }
  }, { passive: false });

  window.addEventListener('touchend', () => { isDragging = false; });

  window.addEventListener('wheel', (e) => {
    camRadius += e.deltaY * 0.004;
    updateCameraPosition();
  }, { passive: true });

  // Window Resize
  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
  });

  // --- UI Interactivity ---
  const audioGate = document.getElementById('audio-gate');
  const btnSound = document.getElementById('btn-sound');
  const soundIcon = document.getElementById('sound-icon');
  const btnPulse = document.getElementById('btn-pulse');
  const btnPalette = document.getElementById('btn-palette');
  const lblPalette = document.getElementById('lbl-palette');
  const valWarp = document.getElementById('val-warp');
  const valFreq = document.getElementById('val-freq');
  const waveCanvas = document.getElementById('wave-canvas');
  const waveCtx = waveCanvas.getContext('2d');

  function startExperience() {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    audioGate.classList.add('hidden');
    triggerWarpPulse();
  }

  audioGate.addEventListener('click', startExperience);

  btnSound.addEventListener('click', () => {
    if (!audioCtx) {
      startExperience();
      return;
    }
    isMuted = !isMuted;
    if (isMuted) {
      masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.08);
      btnSound.classList.remove('active');
      soundIcon.textContent = 'ðŸ”‡';
    } else {
      masterGain.gain.setTargetAtTime(0.7, audioCtx.currentTime, 0.08);
      btnSound.classList.add('active');
      soundIcon.textContent = 'ðŸ”Š';
    }
  });

  btnPulse.addEventListener('click', () => {
    triggerWarpPulse();
  });

  btnPalette.addEventListener('click', () => {
    currentPaletteIdx = (currentPaletteIdx + 1) % PALETTES.length;
    uniforms.u_palette.value = PALETTES[currentPaletteIdx].id;
    lblPalette.textContent = PALETTES[currentPaletteIdx].name;
    triggerWarpPulse();
  });

  // --- Audio Waveform Visualizer on HUD ---
  function drawMiniWaveform() {
    waveCtx.fillStyle = 'rgba(5, 8, 16, 0.7)';
    waveCtx.fillRect(0, 0, waveCanvas.width, waveCanvas.height);

    if (!analyser || isMuted) {
      waveCtx.strokeStyle = 'rgba(255, 170, 70, 0.2)';
      waveCtx.lineWidth = 1.5;
      waveCtx.beginPath();
      waveCtx.moveTo(0, waveCanvas.height / 2);
      waveCtx.lineTo(waveCanvas.width, waveCanvas.height / 2);
      waveCtx.stroke();
      return;
    }

    analyser.getByteTimeDomainData(waveData);
    waveCtx.lineWidth = 1.5;
    waveCtx.strokeStyle = '#ff9922';
    waveCtx.shadowColor = '#ff6600';
    waveCtx.shadowBlur = 6;
    waveCtx.beginPath();

    const sliceWidth = waveCanvas.width * 1.0 / waveData.length;
    let x = 0;
    for (let i = 0; i < waveData.length; i++) {
      const v = waveData[i] / 128.0;
      const y = v * (waveCanvas.height / 2);
      if (i === 0) waveCtx.moveTo(x, y);
      else waveCtx.lineTo(x, y);
      x += sliceWidth;
    }
    waveCtx.stroke();
    waveCtx.shadowBlur = 0;
  }

  // --- Animation & Render Loop ---
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);

    const elapsedTime = clock.getElapsedTime();
    uniforms.u_time.value = elapsedTime;

    // Analyze Audio & Extract Vibration Energy
    if (analyser && !isMuted) {
      analyser.getByteFrequencyData(waveData);
      // Low bass bins (0 to 8)
      let bassSum = 0;
      for (let i = 0; i < 8; i++) bassSum += waveData[i];
      const targetVibe = (bassSum / 8) / 255.0;
      audioVibrationLevel += (targetVibe - audioVibrationLevel) * 0.22;
    } else {
      // Gentle autonomous pulsing if sound is inactive
      audioVibrationLevel = 0.2 + 0.15 * Math.sin(elapsedTime * 2.2);
    }

    // Decay warp pulse
    warpPulseIntensity *= 0.94;
    if (warpPulseIntensity < 0.005) warpPulseIntensity = 0.0;

    uniforms.u_vibration.value = audioVibrationLevel;
    uniforms.u_pulse.value = warpPulseIntensity;

    // Slow ambient camera drift when not dragging
    if (!isDragging) {
      camTheta += 0.0018;
      updateCameraPosition();
    }

    // Update telemetry indicators
    valWarp.textContent = (1.0 + audioVibrationLevel * 0.65 + warpPulseIntensity * 1.5).toFixed(2) + 'x';
    const dynFreq = (43.2 + audioVibrationLevel * 14.5 + warpPulseIntensity * 80.0).toFixed(1);
    valFreq.textContent = dynFreq + ' Hz';

    // Draw HUD wave
    drawMiniWaveform();

    // Render Raymarched Frame
    renderer.render(scene, camera);
  }

  animate();
})();
</script>
