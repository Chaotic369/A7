<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interstellar Big Bang Sequence</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
  }
  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", monospace, sans-serif;
    color: #e0e8f5;
  }
  #canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }
  #canvas-container canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* HUD Overlays */
  .hud-overlay {
    position: absolute;
    z-index: 10;
    pointer-events: none;
  }

  .hud-header {
    top: 24px;
    left: 28px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    text-shadow: 0 0 15px rgba(255, 160, 40, 0.6);
  }
  .hud-title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .hud-title .badge {
    font-size: 9px;
    padding: 2px 7px;
    background: rgba(255, 120, 0, 0.25);
    border: 1px solid rgba(255, 150, 50, 0.5);
    border-radius: 4px;
    color: #ffaa55;
    letter-spacing: 0.15em;
  }
  .hud-subtitle {
    font-size: 11px;
    letter-spacing: 0.25em;
    color: rgba(200, 220, 255, 0.6);
    text-transform: uppercase;
  }

  /* Audio Activation Splash */
  #audio-gate {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(10, 5, 20, 0.85) 0%, rgba(0, 0, 0, 0.95) 100%);
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
    backdrop-filter: blur(8px);
  }
  #audio-gate.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .gate-ring {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: 2px dashed rgba(255, 170, 70, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
    animation: rotateRing 20s linear infinite;
    box-shadow: 0 0 35px rgba(255, 120, 20, 0.25), inset 0 0 25px rgba(255, 100, 0, 0.2);
    position: relative;
  }
  .gate-ring::after {
    content: '';
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    border: 1px solid rgba(255, 220, 160, 0.7);
    animation: pulseCore 2.4s ease-in-out infinite;
  }
  @keyframes rotateRing {
    to { transform: rotate(360deg); }
  }
  @keyframes pulseCore {
    0%, 100% { transform: scale(0.92); opacity: 0.5; }
    50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 10px #ff9922); }
  }
  .gate-icon {
    font-size: 40px;
    filter: drop-shadow(0 0 12px #ff8800);
  }
  .gate-text {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.3em;
    color: #fff;
    text-transform: uppercase;
    margin-bottom: 8px;
    text-shadow: 0 0 10px rgba(255, 150, 50, 0.8);
  }
  .gate-desc {
    font-size: 12px;
    color: rgba(210, 225, 255, 0.65);
    letter-spacing: 0.15em;
  }

  /* Interactive Control Bar */
  .hud-controls {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
    pointer-events: auto;
    background: rgba(8, 12, 22, 0.65);
    border: 1px solid rgba(255, 170, 80, 0.2);
    padding: 10px 18px;
    border-radius: 36px;
    backdrop-filter: blur(16px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 120, 20, 0.1);
    z-index: 20;
  }
  .btn-hud {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 160, 60, 0.25);
    color: #e5efff;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
  }
  .btn-hud:hover {
    background: rgba(255, 140, 30, 0.2);
    border-color: rgba(255, 180, 70, 0.6);
    color: #fff;
    box-shadow: 0 0 14px rgba(255, 120, 0, 0.4);
    transform: translateY(-1px);
  }
  .btn-hud.active {
    background: linear-gradient(135deg, rgba(255, 120, 20, 0.4), rgba(200, 30, 10, 0.4));
    border-color: #ff9933;
    color: #fff;
    box-shadow: 0 0 18px rgba(255, 120, 0, 0.5);
  }
  
  #btn-big-bang {
    background: linear-gradient(135deg, rgba(200, 10, 10, 0.6), rgba(120, 0, 20, 0.6));
    border-color: #ff3333;
    color: #fff;
    font-weight: 800;
    box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
    animation: pulseDanger 2s infinite;
  }
  #btn-big-bang:hover {
    background: linear-gradient(135deg, rgba(255, 30, 30, 0.8), rgba(150, 0, 40, 0.8));
    box-shadow: 0 0 30px rgba(255, 50, 50, 0.8);
  }

  @keyframes pulseDanger {
    0%, 100% { box-shadow: 0 0 15px rgba(255, 0, 0, 0.4); }
    50% { box-shadow: 0 0 30px rgba(255, 0, 0, 0.8); }
  }

  /* Telemetry Panel */
  .hud-stats {
    top: 24px;
    right: 28px;
    text-align: right;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: rgba(180, 210, 255, 0.7);
  }
  .stat-row {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .stat-val {
    color: #ffb055;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .critical-val {
    color: #ff3333 !important;
    text-shadow: 0 0 10px #ff0000;
    animation: flashCritical 0.2s infinite;
  }
  
  @keyframes flashCritical {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
  }

  /* Audio Waveform Canvas */
  #wave-canvas {
    width: 90px;
    height: 24px;
    display: block;
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.4);
  }

  /* Sequence Flash Overlay */
  #flash-overlay {
      position: absolute;
      inset: 0;
      background: white;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s;
  }

  #particle-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    /* Responsive tweaks */
  @media (max-width: 768px) {
    .hud-header { top: 16px; left: 16px; }
    .hud-title { font-size: 15px; }
    .hud-stats { display: none; }
    .hud-controls { bottom: 16px; width: 96%; justify-content: space-around; padding: 8px 6px; flex-wrap: wrap;}
    .btn-hud { padding: 6px 8px; font-size: 9px; }
  }
</style>
</head>
<body>

<div id="canvas-container"></div>
<div id="flash-overlay"></div>
<canvas id="particle-canvas"></canvas>

<!-- Initial Activation Overlay -->
<div id="audio-gate">
  <div class="gate-ring">

<!-- Cinematic HUD -->
<div class="hud-overlay hud-header">

  </button>
  <button id="btn-big-bang" class="btn-hud" title="Trigger Big Bang Sequence">

  </button>
</div>

<!-- Load Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function() {
  // --- Audio Synthesis Engine ---
  let audioCtx = null;
  let isMuted = false;
  let masterGain = null;
  let analyser = null;
  let subOsc = null;
  let subGain = null;
  let droneOsc1 = null;
  let droneOsc2 = null;
  let noiseNode = null;
  let filterNode = null;
  let waveData = null;
  let audioVibrationLevel = 0.0;
  let warpPulseIntensity = 0.0;

  function initAudio() {
    if (audioCtx) return;
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContextClass();

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    analyser.smoothingTimeConstant = 0.8;
    waveData = new Uint8Array(analyser.frequencyBinCount);

    masterGain = audioCtx.createGain();
    masterGain.gain.setValueAtTime(0.7, audioCtx.currentTime);
    masterGain.connect(analyser);
    analyser.connect(audioCtx.destination);

    // 1. Deep Sub-Bass Rumble[span_1](start_span)[span_1](end_span)
    subOsc = audioCtx.createOscillator();
    subOsc.type = 'sine';
    subOsc.frequency.setValueAtTime(43.2, audioCtx.currentTime);

    subGain = audioCtx.createGain();
    subGain.gain.setValueAtTime(0.55, audioCtx.currentTime);
    subOsc.connect(subGain);
    subGain.connect(masterGain);
    subOsc.start();

    // 2. Dual Detuned Saw Drones[span_2](start_span)[span_2](end_span)
    droneOsc1 = audioCtx.createOscillator();
    droneOsc1.type = 'sawtooth';
    droneOsc1.frequency.setValueAtTime(86.4, audioCtx.currentTime); 

    droneOsc2 = audioCtx.createOscillator();
    droneOsc2.type = 'sawtooth';
    droneOsc2.frequency.setValueAtTime(87.2, audioCtx.currentTime); 

    // Lowpass filter[span_3](start_span)[span_3](end_span)
    filterNode = audioCtx.createBiquadFilter();
    filterNode.type = 'lowpass';
    filterNode.frequency.setValueAtTime(260, audioCtx.currentTime);
    filterNode.Q.setValueAtTime(4.2, audioCtx.currentTime);

    const droneGain = audioCtx.createGain();
    droneGain.gain.setValueAtTime(0.25, audioCtx.currentTime);

    droneOsc1.connect(filterNode);
    droneOsc2.connect(filterNode);
    filterNode.connect(droneGain);
    droneGain.connect(masterGain);

    droneOsc1.start();
    droneOsc2.start();

    // 3. Cosmic Wind / High accretion turbulence noise[span_4](start_span)[span_4](end_span)
    const bufferSize = audioCtx.sampleRate * 2;
    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      output[i] = (Math.random() * 2 - 1) * 0.4;
    }
    noiseNode = audioCtx.createBufferSource();
    noiseNode.buffer = noiseBuffer;
    noiseNode.loop = true;

    const noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.setValueAtTime(420, audioCtx.currentTime);
    noiseFilter.Q.setValueAtTime(2.0, audioCtx.currentTime);

    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.12, audioCtx.currentTime);

    noiseNode.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(masterGain);
    noiseNode.start();
  }

  // Distortion curve generator for the tear sound
  function makeDistortionCurve(amount) {
    const k = typeof amount === 'number' ? amount : 50;
    const n_samples = 44100;
    const curve = new Float32Array(n_samples);
    const deg = Math.PI / 180;
    for (let i = 0; i < n_samples; ++i) {
      let x = i * 2 / n_samples - 1;
      curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
    }
    return curve;
  }

  // --- Palettes ---
  const PALETTES = [
    { name: "INTERSTELLAR", id: 0 },
    { name: "QUANTUM VIOLET", id: 1 },
    { name: "SUPERNOVA CYAN", id: 2 },
    { name: "SINGULARITY DUAL", id: 3 }
  ];
  let currentPaletteIdx = 0;

  // --- Three.js & Raymarching Black Hole Shader Setup ---
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
  container.appendChild(renderer.domElement);

  // Black Hole Gravitational Lensing & Raymarching Fragment Shader[span_5](start_span)[span_5](end_span)
  const fragmentShader = `
    uniform vec2 u_resolution;
    uniform float u_time;
    uniform vec3 u_cam_pos;
    uniform vec3 u_cam_target;
    uniform float u_vibration;
    uniform float u_pulse;
    uniform int u_palette;
    
    // Sequence specific uniforms
    uniform float u_mix_galaxy;
    uniform float u_dark_factor;
    uniform float u_flash;
    uniform float u_warp_mult;
        uniform float u_seed;

    #define PI 3.14159265359
    #define STEPS 64
    #define RS 1.0        // Schwarzschild radius[span_6](start_span)[span_6](end_span)
    #define RIN 1.8       // Inner disk edge (ISCO)[span_7](start_span)[span_7](end_span)
    #define ROUT 6.2      // Outer disk edge[span_8](start_span)[span_8](end_span)

    // Fast Pseudo-random noise[span_9](start_span)[span_9](end_span)
    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
    }

    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i + vec2(0.0,0.0)), hash(i + vec2(1.0,0.0)), u.x),
                 mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), u.x), u.y);
    }

    float fbm(vec2 p) {
      float v = 0.0;
      float a = 0.5;
      mat2 rot = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.5));
      for (int i = 0; i < 4; ++i) {
        v += a * noise(p);
        p = rot * p * 2.0 + vec2(100.0);
        a *= 0.5;
      }
      return v;
    }

    // Procedural Starfield with Background Gravitational Shear[span_10](start_span)[span_10](end_span)
    vec3 backgroundStars(vec3 dir, float warpRipple) {
      // Metric ripple distortion on background rays heavily influenced by warp multiplier
      dir.xy += vec2(sin(dir.z * 18.0 + u_time * 3.0), cos(dir.z * 18.0 + u_time * 3.0)) * 0.015 * warpRipple * u_warp_mult;
      dir = normalize(dir);

      vec2 uv = vec2(atan(dir.z, dir.x), asin(clamp(dir.y, -1.0, 1.0)));
      float n = hash(floor(uv * 180.0));
      vec3 starCol = vec3(0.0);
      if (n > 0.985) {
        float b = pow((n - 0.985) / 0.015, 6.0) * (0.6 + 0.4 * sin(u_time * 6.0 + n * 40.0));
        starCol = vec3(b * 1.5) * mix(vec3(0.7, 0.85, 1.0), vec3(1.0, 0.8, 0.6), hash(uv));
      }

      // Distant cosmic dust & faint nebula ribbon[span_11](start_span)[span_11](end_span)
      float nebula = fbm(uv * 2.5 + vec2(u_time * 0.01));
      vec3 nebCol = mix(vec3(0.02, 0.04, 0.08), vec3(0.08, 0.03, 0.09), nebula) * smoothstep(0.3, 0.8, nebula);
      
      // When galaxy is active, boost background slightly
      nebCol = mix(nebCol, nebCol * 2.0 + vec3(0.0, 0.0, 0.05), u_mix_galaxy);
      
      return starCol + nebCol;
    }

    // Palette Color Generator for Vibrating Accretion Disk[span_12](start_span)[span_12](end_span)
    vec3 getDiskPalette(float temp, float doppler, float vibe) {
      vec3 c = vec3(0.0);
      if (u_palette == 0) {
        vec3 colCore = vec3(1.0, 0.95, 0.85);
        vec3 colMid  = vec3(1.0, 0.58, 0.12);
        vec3 colRim  = vec3(0.75, 0.12, 0.02);
        c = mix(colRim, colMid, smoothstep(0.0, 0.6, temp));
        c = mix(c, colCore, smoothstep(0.6, 1.0, temp));
        c += vec3(0.3 * sin(u_time * 4.0), 0.1 * cos(u_time * 5.0), 0.25 * sin(u_time * 3.0)) * vibe;
      } else if (u_palette == 1) {
        vec3 colCore = vec3(0.9, 0.95, 1.0);
        vec3 colMid  = vec3(0.7, 0.1, 0.9);
        vec3 colRim  = vec3(0.2, 0.02, 0.6);
        c = mix(colRim, colMid, smoothstep(0.0, 0.6, temp));
        c = mix(c, colCore, smoothstep(0.6, 1.0, temp));
        c.rg += 0.25 * vibe * vec2(sin(u_time * 8.0), cos(u_time * 7.0));
      } else if (u_palette == 2) {
        vec3 colCore = vec3(0.95, 1.0, 1.0);
        vec3 colMid  = vec3(0.05, 0.85, 0.95);
        vec3 colRim  = vec3(0.01, 0.2, 0.6);
        c = mix(colRim, colMid, smoothstep(0.0, 0.5, temp));
        c = mix(c, colCore, smoothstep(0.5, 1.0, temp));
        c.g += 0.2 * vibe;
      } else {
        float hue = fract(temp * 0.9 + u_time * 0.15 + vibe * 0.4);
        c = 0.5 + 0.5 * cos(6.28318 * (vec3(1.0, 1.0, 1.0) * hue + vec3(0.0, 0.33, 0.67)));
        c = mix(c, vec3(1.2), smoothstep(0.7, 1.0, temp));
      }
      c *= pow(doppler, 3.2);
      return c;
    }

    void main() {
      vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution) / u_resolution.y;

      // Camera Matrix setup[span_15](start_span)[span_15](end_span)
      vec3 ro = u_cam_pos;
      vec3 forward = normalize(u_cam_target - ro);
      vec3 right = normalize(cross(forward, vec3(0.0, 1.0, 0.0)));
      vec3 up = cross(right, forward);

      // Camera vibration / shake[span_16](start_span)[span_16](end_span)
      float shakeAmp = (u_vibration * 0.035 + u_pulse * 0.06) * u_warp_mult * 0.2;
      vec2 shake = vec2(sin(u_time * 37.0), cos(u_time * 43.0)) * shakeAmp;
      vec3 rd = normalize(forward * 1.55 + right * (uv.x + shake.x) + up * (uv.y + shake.y));

      vec3 rayPos = ro;
      vec3 rayDir = rd;
      vec3 accumColor = vec3(0.0);
      float alpha = 0.0;
      bool hitHorizon = false;

      // Disk tilt matrix[span_17](start_span)[span_17](end_span)
      float tiltAngle = 0.18;
      mat3 tiltMat = mat3(
        1.0, 0.0, 0.0,
        0.0, cos(tiltAngle), -sin(tiltAngle),
        0.0, sin(tiltAngle), cos(tiltAngle)
      );

      float h = 0.16; // Integration step size[span_18](start_span)[span_18](end_span)
      float totalDist = 0.0;
      
      // Dynamic singularity radius (shrinks to allow central star when galaxy forms)
      float currentRS = mix(RS, 0.0, u_mix_galaxy);

      for (int i = 0; i < STEPS; i++) {
        float r = length(rayPos);

        // Check Event Horizon intersection[span_19](start_span)[span_19](end_span)
        if (r < currentRS * 1.02) {
          hitHorizon = true;
          break;
        }

        // Ray bending towards the black hole (Kerr deflection acceleration)[span_20](start_span)[span_20](end_span)
        // Modified heavily by u_warp_mult for constant light year speed bending
        float bendForce = 1.45 * RS / (r * r * r * r);
        float ripple = 1.0 + 0.35 * sin(r * 9.0 - u_time * 12.0) * (u_vibration + u_pulse * 1.5);
        vec3 accel = -rayPos * bendForce * ripple * u_warp_mult;

        vec3 prevPos = rayPos;
        rayDir = normalize(rayDir + accel * h);
        rayPos += rayDir * h;
        totalDist += h;

        h = max(0.05, r * 0.045);

        // Transform ray segment into tilted accretion disk frame[span_22](start_span)[span_22](end_span)
        vec3 p0 = tiltMat * prevPos;
        vec3 p1 = tiltMat * rayPos;

        // Check if segment crosses disk plane y = 0[span_23](start_span)[span_23](end_span)
        if ((p0.y * p1.y) < 0.0) {
          float tPlane = -p0.y / (p1.y - p0.y);
          vec3 hitP = mix(p0, p1, tPlane);
          float diskRadius = length(hitP.xz);

          float currentRIN = mix(RIN, 0.0, u_mix_galaxy); // Allow filling the center for galaxy

          if (diskRadius >= currentRIN && diskRadius <= ROUT) {
            float normR = (diskRadius - currentRIN) / (ROUT - currentRIN);

            // ---- BLACK HOLE LOGIC (Original) ----[span_24](start_span)[span_24](end_span)

        if (p.radius <= horizon * 0.85) {
          particles.splice(i, 1);
          continue;
        }
        const x = cx + Math.cos(p.angle) * p.radius;
        const y = cy + Math.sin(p.angle) * p.radius;
        const fade = Math.max(0.0, Math.min(1.0, (p.radius - horizon * 0.85) / (horizon * 0.6)));
        particleCtx.strokeStyle = 'hsla(' + p.hue + ', 100%, ' + (60 + 30 * (1.0 - fade)) + '%, ' + (0.85 * fade) + ')';
        particleCtx.lineWidth = p.size * (0.7 + particleStrength);
        particleCtx.beginPath();
        particleCtx.moveTo(tailX, tailY);
        particleCtx.lineTo(x, y);
        particleCtx.stroke();
      }
      particleCtx.globalCompositeOperation = 'source-over';
    }

    // --- Animation & Render Loop ---[span_42](start_span)[span_42](end_span)
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);

    const elapsedTime = clock.getElapsedTime();
    uniforms.u_time.value = elapsedTime;

    // Default parameters
    let currentVibration = 0.0;
    let currentWarpMult = 1.0;
    
    // Analyze Audio & Extract Vibration Energy[span_43](start_span)[span_43](end_span)
    if (analyser && !isMuted) {
      analyser.getByteFrequencyData(waveData);
      let bassSum = 0;
      for (let i = 0; i < 8; i++) bassSum += waveData[i];
      const targetVibe = (bassSum / 8) / 255.0;
      audioVibrationLevel += (targetVibe - audioVibrationLevel) * 0.22;
    } else {
      audioVibrationLevel = 0.2 + 0.15 * Math.sin(elapsedTime * 2.2);
    }
    
    currentVibration = audioVibrationLevel;

    // Decay warp pulse[span_44](start_span)[span_44](end_span)
    warpPulseIntensity *= 0.94;
    if (warpPulseIntensity < 0.005) warpPulseIntensity = 0.0;

    // Sequence Overrides
    if(sequenceActive) {
        let t = elapsedTime - seqStartTime;
        if(t < 2.0) {
            // Build up - Extreme space bending
            currentWarpMult = 1.0 + (t / 2.0) * 12.0; 
            currentVibration = Math.max(currentVibration, t / 2.0);
        } else if (t < 2.5) {
            // Absolute Darkness Phase
            uniforms.u_dark_factor.value = 0.0;
            currentWarpMult = 20.0; // Violent wrapping
            currentVibration = 2.0;
        } else if (t < 5.0) {
            // Flash & Bang (Slow motion expansion)
            uniforms.u_dark_factor.value = 1.0;
            let flashTime = t - 2.5;
            
            // Blinding HTML CSS flash to ensure true white
            if (flashTime < 0.1) {
                flashOverlay.style.opacity = '1';
            } else {
                flashOverlay.style.opacity = Math.max(0, 1 - (flashTime * 1.5)).toString();
            }

            uniforms.u_flash.value = Math.max(0.0, 1.0 - (flashTime / 2.0)); 
            currentWarpMult = 20.0 - (flashTime / 2.5) * 15.0; 
        } else {
            // Galaxy forming slowly
            uniforms.u_flash.value = 0.0;
            flashOverlay.style.opacity = '0';
            currentWarpMult = 4.0; // Constant elevated space bending during galaxy[span_45](start_span)[span_45](end_span)
            
            let galTime = t - 5.0;
            uniforms.u_mix_galaxy.value = Math.min(1.0, galTime / 8.0); // Slow transition over 8s
        }
    }

    if (sequenceActive) {
          const st = elapsedTime - seqStartTime;
          let seqDark = 1.0;
          let seqFlash = 0.0;
          let seqOverlay = 0.0;
          let seqSeed = 0.0;
          let seqGalaxy = 0.0;
          particleStrength = 0.0;

          if (st < 3.5) {
            // Space wraps, particles spiral into the hole
            const k = st / 3.5;
            particleStrength = Math.min(1.0, 0.15 + k);
            currentWarpMult = 1.0 + k * k * 19.0;
            currentVibration = Math.max(currentVibration, k);
          } else if (st < 3.62) {
            // Bang 1: blinding flash
            seqFlash = 1.0;
            seqOverlay = 1.0;
            currentWarpMult = 20.0;
            currentVibration = 2.0;
          } else if (st < 4.2) {
            // Absolute black
            seqDark = 0.0;
            currentWarpMult = 20.0;
          } else if (st < 5.6) {
            // A light appears and space warps inside it
            const k = (st - 4.2) / 1.4;
            seqSeed = 0.02 + 0.98 * k * k;
            currentWarpMult = 6.0 + k * 16.0;
            currentVibration = Math.max(currentVibration, 0.4 + k * 1.6);
          } else if (st < 5.75) {
            // Bang 2: second flash
            seqFlash = 1.0;
            seqOverlay = 1.0;
            currentWarpMult = 22.0;
            currentVibration = 2.0;
          } else {
            // Milky Way forms
            const ft = st - 5.75;
            seqFlash = Math.max(0.0, 1.0 - ft / 2.5);
            seqOverlay = Math.max(0.0, 1.0 - ft * 1.2);
            currentWarpMult = Math.max(4.0, 22.0 - ft * 6.0);
            seqGalaxy = Math.min(1.0, ft / 8.0);
          }

          uniforms.u_dark_factor.value = seqDark;
          uniforms.u_flash.value = seqFlash;
          uniforms.u_seed.value = seqSeed;
          uniforms.u_mix_galaxy.value = seqGalaxy;
          flashOverlay.style.opacity = seqOverlay.toString();
        }

        uniforms.u_vibration.value = currentVibration;
    uniforms.u_pulse.value = warpPulseIntensity;
    uniforms.u_warp_mult.value = currentWarpMult;

    // Slow ambient camera drift[span_46](start_span)[span_46](end_span)
    if (!isDragging) {
      camTheta += 0.0018;
      updateCameraPosition();
    }

    // Update telemetry[span_47](start_span)[span_47](end_span)
    valWarp.textContent = (currentWarpMult + currentVibration * 0.65 + warpPulseIntensity * 1.5).toFixed(2) + 'x';
    const dynFreq = (43.2 + currentVibration * 14.5 + warpPulseIntensity * 80.0 + (sequenceActive ? 300 : 0)).toFixed(1);
    valFreq.textContent = dynFreq + ' Hz';

    updateParticles();
        drawMiniWaveform();
    renderer.render(scene, camera);
  }

  animate();
})();
