<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Sequence: Big Bang to Black Hole</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', sans-serif;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #flash-overlay {
            position: absolute;
            top: 0;
            left: 0;

            height: 100vh;
            background-color: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.1s; /* Quick transition for flash, JS handles the slow fade */
        }

        #ui-layer {

    </style>
    <!-- Include Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="flash-overlay"></div>
    
    <div id="ui-layer">
        <button id="start-btn">Initiate Sequence</button>
    </div>

    <div id="canvas-container"></div>

    <script>
        // Sequence Timings (in seconds)
        const TIMINGS = {
            START: 0,
            DARKNESS: 0,        // 0.0s - 1.0s
            BIG_BANG: 1.0,      // 1.0s
            EXPANSION: 1.2,     // 1.2s - 5.0s
            WARP_SPEED: 5.0,    // 5.0s - 9.0s
            GALAXY: 9.0,        // 9.0s - 14.0s
            BLACK_HOLE: 14.0    // 14.0s+
        };

        let currentState = 'INIT';
        let startTime = 0;
        
        // Three.js Core
        let scene, camera, renderer;
        let renderTarget, postCamera, postScene, postMaterial;
        
        // Particle System
        const PARTICLE_COUNT = 60000;
        let particles, geometry;
        let positions, velocities, targetGalaxyPositions, colors;

        // Audio Context
        let audioCtx;
        let masterGain;

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.connect(audioCtx.destination);
            masterGain.gain.value = 0.8;
        }

        function createDistortionCurve(amount) {
            const k = typeof amount === 'number' ? amount : 50;
            const n_samples = 44100;
            const curve = new Float32Array(n_samples);
            const deg = Math.PI / 180;
            for (let i = 0; i < n_samples; ++i) {
                const x = i * 2 / n_samples - 1;
                curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
            }
            return curve;
        }

        function playDistortion() {
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const dist = audioCtx.createWaveShaper();

            osc.type = 'sawtooth';
            dist.curve = createDistortionCurve(400);
            dist.oversample = '4x';

            osc.connect(gain);
            gain.connect(dist);
            dist.connect(masterGain);

            // High pitch dropping rapidly
            osc.frequency.setValueAtTime(2000, t);
            osc.frequency.exponentialRampToValueAtTime(50, t + 0.8);

            // Quick fade in and out
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(1.5, t + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.9);

            osc.start(t);
            osc.stop(t + 1);
        }

        function playBigBang() {
            const t = audioCtx.currentTime;
            
            // White noise burst
            const bufferSize = audioCtx.sampleRate * 12; // 12 seconds buffer
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for(let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            // Lowpass filter swooping down for massive boom
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.Q.value = 0.5;
            filter.frequency.setValueAtTime(10000, t);
            filter.frequency.exponentialRampToValueAtTime(30, t + 6);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(2.0, t + 0.1); // Massive instant hit
            gain.gain.exponentialRampToValueAtTime(0.01, t + 10); // Long slow fade

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);

            noise.start(t);
        }

        let rumbleOsc, rumbleGain;
        function startSpaceRumble() {
            const t = audioCtx.currentTime;
            
            // Create a deep, menacing drone for the black hole
            rumbleOsc = audioCtx.createOscillator();
            rumbleOsc.type = 'sine';
            rumbleOsc.frequency.setValueAtTime(40, t); // Sub-bass

            const lfo = audioCtx.createOscillator();
            lfo.type = 'sine';
            lfo.frequency.setValueAtTime(0.2, t); // Slow pulse

            const lfoGain = audioCtx.createGain();
            lfoGain.gain.setValueAtTime(10, t); // Pulse depth

            lfo.connect(lfoGain);
            lfoGain.connect(rumbleOsc.frequency);
            
            rumbleGain = audioCtx.createGain();
            rumbleGain.gain.setValueAtTime(0, t);
            rumbleGain.gain.linearRampToValueAtTime(1.2, t + 5); // Fade in over 5s

            rumbleOsc.connect(rumbleGain);
            rumbleGain.connect(masterGain);

            rumbleOsc.start(t);
            lfo.start(t);
        }

        function initThree() {
            const container = document.getElementById('canvas-container');

            // Main Scene (The Galaxy / Particles)
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
            camera.position.z = 200;

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setClearColor(0x000000);
            container.appendChild(renderer.domElement);

            // Setup Particle System
            geometry = new THREE.BufferGeometry();
            positions = new Float32Array(PARTICLE_COUNT * 3);
            velocities = new Float32Array(PARTICLE_COUNT * 3);
            targetGalaxyPositions = new Float32Array(PARTICLE_COUNT * 3);
            colors = new Float32Array(PARTICLE_COUNT * 3);

            const color1 = new THREE.Color(0x2a52be); // Blue
            const color2 = new THREE.Color(0xff6b6b); // Red/Orange
            const color3 = new THREE.Color(0xffffff); // White

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                // Initialize at origin (Big Bang)
                positions[i * 3] = 0;
                positions[i * 3 + 1] = 0;
                positions[i * 3 + 2] = 0;

                // Random spherical explosion velocities
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                const speed = Math.random() * 150 + 50;

                velocities[i * 3] = Math.sin(phi) * Math.cos(theta) * speed;
                velocities[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * speed;
                velocities[i * 3 + 2] = Math.cos(phi) * speed;

                // Calculate Target Galaxy Positions (Spiral)
                const armOffset = Math.random() * Math.PI * 2;
                const radius = Math.random() * 600;
                const spiralAngle = radius * 0.015 + armOffset;
                
                targetGalaxyPositions[i * 3] = Math.cos(spiralAngle) * radius;
                targetGalaxyPositions[i * 3 + 1] = (Math.random() - 0.5) * (1500 / (radius + 10)); // Flatten disk
                targetGalaxyPositions[i * 3 + 2] = Math.sin(spiralAngle) * radius - 1000; // Center galaxy far away at Z=-1000

                // Assign Colors based on distance from center
                let mixedColor = color1.clone();
                if (radius < 200) {
                    mixedColor.lerp(color3, 1.0 - (radius / 200));
                } else {
                    mixedColor.lerp(color2, (radius - 200) / 400);
                }
                
                colors[i * 3] = mixedColor.r;
                colors[i * 3 + 1] = mixedColor.g;
                colors[i * 3 + 2] = mixedColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 2.0,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.8,
                depthWrite: false
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            // Setup Render Target for Post-Processing (Lensing effect)
            renderTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight);
            postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            postScene = new THREE.Scene();

            const postGeo = new THREE.PlaneGeometry(2, 2);
            postMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    tDiffuse: { value: renderTarget.texture },
                    iTime: { value: 0 },
                    iResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                    bhFade: { value: 0.0 }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D tDiffuse;
                    uniform float iTime;
                    uniform vec2 iResolution;
                    uniform float bhFade;
                    varying vec2 vUv;

                    void main() {
                        vec2 p = -1.0 + 2.0 * vUv;
                        p.x *= iResolution.x / iResolution.y;

                        float r = length(p);
                        float mass = 0.25; // Event horizon size
                        
                        // Gravitational Lensing: Bend UVs towards the center
                        vec2 lensed_uv = vUv;
                        if (r > mass) {
                            float deflection = (mass * mass) / (r * r);
                            // Only apply lensing as the black hole fades in
                            vec2 offset = normalize(p) * deflection * bhFade * 0.3;
                            lensed_uv -= offset;
                        }

                        // Ensure UVs don't wrap weirdly
                        lensed_uv = clamp(lensed_uv, 0.0, 1.0);
                        
                        vec4 bg = texture2D(tDiffuse, lensed_uv);

                        // Event Horizon
                        float eventHorizon = smoothstep(mass, mass + 0.01, r);
                        bg.rgb *= mix(1.0, eventHorizon, bhFade);

                        // Accretion Disk (Interstellar style)
                        vec3 diskColor = vec3(0.0);
                        
                        if (bhFade > 0.01) {
                            float angle = atan(p.y, p.x) + iTime * 0.8;
                            
                            // 1. Equatorial Plane Disk
                            vec2 disk_p = vec2(p.x, p.y * 3.5); // Flatten to tilt
                            float disk_r = length(disk_p);
                            float ring1 = smoothstep(mass*6.0, mass*2.5, disk_r) * smoothstep(mass*2.0, mass*2.5, disk_r);
                            
                            // Doppler beaming (brighter approaching, darker receding)
                            float doppler = 1.0 + p.x * 1.8;
                            
                            // 2. Lensed back of the disk (Bent over top and bottom)
                            // Simulate severe gravitational deflection of the far side of the disk
                            float bent_y = p.y * (1.0 + (mass*mass*mass)/(r*r*r)*12.0);
                            vec2 bent_p = vec2(p.x, bent_y);
                            float bent_r = length(bent_p);
                            float ring2 = smoothstep(mass*5.0, mass*2.2, bent_r) * smoothstep(mass*2.0, mass*2.2, bent_r);
                            
                            // Noise texture for accretion disk
                            float n = fract(sin(dot(vec2(angle, disk_r*2.0), vec2(12.9898, 78.233))) * 43758.5453);
                            float n2 = sin(angle * 15.0 - iTime * 5.0) * 0.5 + 0.5;
                            
                            float combinedRing = ring1 + (ring2 * smoothstep(0.0, 0.5, abs(p.y))); // Add bent ring mainly at poles
                            float glow = combinedRing * (0.6 + 0.4*n) * (0.8 + 0.2*n2) * doppler;
                            
                            // Coloring
                            diskColor = vec3(1.0, 0.5, 0.1) * glow * 2.0; // Fiery orange
                            diskColor += vec3(1.0, 0.9, 0.6) * pow(glow, 2.5); // Bright white core
                        }

                        vec3 finalColor = bg.rgb + diskColor * bhFade;
                        gl_FragColor = vec4(finalColor, 1.0);
                    }
                `
            });

            const postQuad = new THREE.Mesh(postGeo, postMaterial);
            postScene.add(postQuad);

            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderTarget.setSize(window.innerWidth, window.innerHeight);
            postMaterial.uniforms.iResolution.value.set(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (currentState === 'INIT') {
                renderer.render(scene, camera);
                return;
            }

            const currentTime = (Date.now() - startTime) / 1000;
            const dt = 0.016; // Approx fixed delta time for simulation

            const positionAttr = geometry.attributes.position;
            const posArray = positionAttr.array;
            const flashOverlay = document.getElementById('flash-overlay');

            // --- STATE LOGIC ---

            if (currentTime >= TIMINGS.DARKNESS && currentTime < TIMINGS.BIG_BANG) {
                // Pre-bang darkness
                flashOverlay.style.opacity = '1';
                flashOverlay.style.backgroundColor = 'black';
                particles.visible = false;
            } 
            else if (currentTime >= TIMINGS.BIG_BANG && currentState !== 'EXPANSION') {
                // BIG BANG EVENT
                currentState = 'EXPANSION';
                flashOverlay.style.transition = 'none'; // Instant
                flashOverlay.style.opacity = '1';
                flashOverlay.style.backgroundColor = 'white';
                particles.visible = true;
                playBigBang();
                
                // Set fade out transition for expansion phase
                setTimeout(() => {
                    flashOverlay.style.transition = 'opacity 4s ease-out';
                    flashOverlay.style.opacity = '0';
                }, 50);
            }

            // Phase Physics
            if (currentTime >= TIMINGS.BIG_BANG && currentTime < TIMINGS.WARP_SPEED) {
                // Expanding slowly
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    posArray[i * 3] += velocities[i * 3] * dt * 0.1;
                    posArray[i * 3 + 1] += velocities[i * 3 + 1] * dt * 0.1;
                    posArray[i * 3 + 2] += velocities[i * 3 + 2] * dt * 0.1;
                }
                positionAttr.needsUpdate = true;
            }
            
            else if (currentTime >= TIMINGS.WARP_SPEED && currentTime < TIMINGS.GALAXY) {
                // WARP SPEED: Camera zooms backward fast, FOV stretches
                camera.position.z -= 400 * dt; // Move fast from z=200 towards z=-1000
                camera.fov += (130 - camera.fov) * (dt * 2);
                camera.updateProjectionMatrix();

                // Keep expanding slightly
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    posArray[i * 3] += velocities[i * 3] * dt * 0.2;
                    posArray[i * 3 + 1] += velocities[i * 3 + 1] * dt * 0.2;
                    posArray[i * 3 + 2] += velocities[i * 3 + 2] * dt * 0.2;
                }
                positionAttr.needsUpdate = true;
            }
            
            else if (currentTime >= TIMINGS.GALAXY) {
                // GALAXY FORMATION
                // Slow down camera and normalize FOV
                camera.position.z += (-700 - camera.position.z) * (dt * 2); 
                camera.fov += (75 - camera.fov) * (dt * 2);
                camera.updateProjectionMatrix();

                // Rotate the entire galaxy
                particles.rotation.y += 0.05 * dt;
                particles.rotation.x = 0.2; // slight tilt

                // Interpolate particles into spiral shape
                const lerpFactor = Math.min(dt * 0.5, 1.0);
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    posArray[i * 3] += (targetGalaxyPositions[i * 3] - posArray[i * 3]) * lerpFactor;
                    posArray[i * 3 + 1] += (targetGalaxyPositions[i * 3 + 1] - posArray[i * 3 + 1]) * lerpFactor;
                    posArray[i * 3 + 2] += (targetGalaxyPositions[i * 3 + 2] - posArray[i * 3 + 2]) * lerpFactor;
                }
                positionAttr.needsUpdate = true;
            }

            if (currentTime >= TIMINGS.BLACK_HOLE) {
                if (currentState !== 'BLACK_HOLE') {
                    currentState = 'BLACK_HOLE';
                    startSpaceRumble();
                }
                // Fade in the Black Hole shader effect
                let currentFade = postMaterial.uniforms.bhFade.value;
                if (currentFade < 1.0) {
                    postMaterial.uniforms.bhFade.value = Math.min(1.0, currentFade + dt * 0.2);
                }
            }

            // Render Pipeline
            postMaterial.uniforms.iTime.value = currentTime;
            
            // Render 3D Scene to RenderTarget
            renderer.setRenderTarget(renderTarget);
            renderer.render(scene, camera);
            
            // Render Post-Processing Quad to Screen
            renderer.setRenderTarget(null);
            renderer.render(postScene, postCamera);
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('ui-layer').classList.add('hidden');
            initAudio();
            playDistortion();
            startTime = Date.now();
            currentState = 'RUNNING';
        });

        // Initialize Three.js scene immediately
        initThree();
        animate();

    </script>
</body>
</html>
