<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Interstellar Genesis</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: white;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            background: rgba(0, 0, 0, 0.8);
            transition: opacity 0.5s ease;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            background: transparent;
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        button:hover {
            background: white;
            color: black;
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <button id="start-btn">Initiate Genesis</button>
    </div>
    <div id="flash-overlay"></div>
    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, clock;
        let audioCtx;
        
        // Visual elements
        let warpParticles, galaxyParticles, solarSystem;
        let planets = [];
        
        // Animation State
        let state = 'IDLE'; // IDLE, DARKNESS, BANG, WARP, GALAXY, SOLAR
        let stateStartTime = 0;
        
        const flashOverlay = document.getElementById('flash-overlay');

        function init() {
            // Setup Three.js
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.FogExp2(0x000000, 0.001);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.z = 500;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // Create Visual Assets (hidden initially)
            createWarpParticles();
            createGalaxy();
            createSolarSystem();

            window.addEventListener('resize', onWindowResize, false);
            
            document.getElementById('start-btn').addEventListener('click', startExperience);
        }

        function createWarpParticles() {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            for ( let i = 0; i < 5000; i ++ ) {
                const x = (Math.random() - 0.5) * 2000;
                const y = (Math.random() - 0.5) * 2000;
                const z = (Math.random() - 0.5) * 2000;
                vertices.push( x, y, z );
            }
            geometry.setAttribute( 'position', new THREE.Float32BufferAttribute( vertices, 3 ) );
            
            // Custom shader for stretching particles to simulate speed
            const material = new THREE.PointsMaterial( { color: 0xffffff, size: 2, transparent: true, opacity: 0 } );
            warpParticles = new THREE.Points( geometry, material );
            scene.add( warpParticles );
        }

        function createGalaxy() {
            const particleCount = 20000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            const color1 = new THREE.Color(0x2a0088);
            const color2 = new THREE.Color(0xff4b72);
            const color3 = new THREE.Color(0xffffff);

            for(let i=0; i<particleCount; i++) {
                // Archimedean spiral
                const radius = Math.random() * 400;
                const theta = radius * 0.05 + (Math.random() * 1.5 - 0.75); // Arms
                
                const x = Math.cos(theta) * radius + (Math.random() - 0.5) * 20;
                const y = (Math.random() - 0.5) * (400 - radius) * 0.1; // Thicker in middle
                const z = Math.sin(theta) * radius + (Math.random() - 0.5) * 20;

                positions[i*3] = x;
                positions[i*3+1] = y;
                positions[i*3+2] = z;

                // Color based on distance from center
                const mixedColor = color1.clone().lerp(color2, radius/400);
                if(Math.random() > 0.9) mixedColor.lerp(color3, 0.8);

                colors[i*3] = mixedColor.r;
                colors[i*3+1] = mixedColor.g;
                colors[i*3+2] = mixedColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 1.5,
                vertexColors: true,
                transparent: true,
                opacity: 0,
                blending: THREE.AdditiveBlending
            });

            galaxyParticles = new THREE.Points(geometry, material);
            galaxyParticles.rotation.x = Math.PI / 3; // Tilt
            galaxyParticles.scale.set(0.01, 0.01, 0.01); // Start small for bang
            scene.add(galaxyParticles);
        }

        function createSolarSystem() {
            solarSystem = new THREE.Group();
            
            // Sun
            const sunGeo = new THREE.SphereGeometry(15, 32, 32);
            const sunMat = new THREE.MeshBasicMaterial({ color: 0xffddaa, transparent: true, opacity: 0 });
            const sun = new THREE.Mesh(sunGeo, sunMat);
            solarSystem.add(sun);
            planets.push({mesh: sun, type: 'sun'});

            // Planets
            const colors = [0x888888, 0xe39e1c, 0x287ab8, 0xc1440e];
            const distances = [30, 50, 75, 100];
            const speeds = [0.04, 0.02, 0.015, 0.01];

            for(let i=0; i<4; i++) {
                const geo = new THREE.SphereGeometry(i===2?4:2.5, 16, 16);
                const mat = new THREE.MeshStandardMaterial({ color: colors[i], transparent: true, opacity: 0 });
                const mesh = new THREE.Mesh(geo, mat);
                
                const pivot = new THREE.Group();
                pivot.add(mesh);
                mesh.position.x = distances[i];
                
                solarSystem.add(pivot);
                planets.push({ mesh: mesh, mat: mat, pivot: pivot, speed: speeds[i], type: 'planet' });
            }

            // Light
            const light = new THREE.PointLight(0xffffff, 2, 300);
            solarSystem.add(light);
            
            solarSystem.position.z = -100;
            solarSystem.visible = false;
            scene.add(solarSystem);
        }

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        // Distortion sound (Phase 1)
        function playDistortion() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const distortion = audioCtx.createWaveShaper();

            // Create heavy distortion curve
            function makeDistortionCurve(amount) {
                const k = typeof amount === 'number' ? amount : 50,
                n_samples = 44100,
                curve = new Float32Array(n_samples),
                deg = Math.PI / 180;
                for (let i = 0; i < n_samples; ++i ) {
                    const x = i * 2 / n_samples - 1;
                    curve[i] = ( 3 + k ) * x * 20 * deg / ( Math.PI + k * Math.abs(x) );
                }
                return curve;
            }

            distortion.curve = makeDistortionCurve(400);
            distortion.oversample = '4x';

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(50, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 1.5); // Rise

            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 0.2);
            gain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 1.4);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.5); // Cut off exactly at Big Bang

            osc.connect(distortion);
            distortion.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 1.5);
        }

        // Big Bang Boom (Phase 2)
        function playBigBang() {
            // White Noise Burst
            const bufferSize = audioCtx.sampleRate * 4; // 4 seconds
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'lowpass';
            noiseFilter.frequency.setValueAtTime(20000, audioCtx.currentTime);
            noiseFilter.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 3);

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(1, audioCtx.currentTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 3);

            // Deep Sub Rumble
            const osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(60, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 3);

            const oscGain = audioCtx.createGain();
            oscGain.gain.setValueAtTime(1.5, audioCtx.currentTime);
            oscGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 4);

            noise.connect(noiseFilter).connect(noiseGain).connect(audioCtx.destination);
            osc.connect(oscGain).connect(audioCtx.destination);

            noise.start();
            osc.start();
            noise.stop(audioCtx.currentTime + 4);
            osc.stop(audioCtx.currentTime + 4);
        }

        function startExperience() {
            document.getElementById('ui-layer').style.opacity = '0';
            setTimeout(() => document.getElementById('ui-layer').style.display = 'none', 500);

            initAudio();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            clock.start();
            state = 'DARKNESS';
            stateStartTime = clock.getElapsedTime();

            playDistortion();
            
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();
            const elapsedStateTime = time - stateStartTime;
            const delta = clock.getDelta();

            // State Machine
            if (state === 'DARKNESS') {
                // Absolute darkness, distortion sound is playing
                if (elapsedStateTime > 1.5) {
                    state = 'BANG';
                    stateStartTime = time;
                    playBigBang();
                }
            } 
            else if (state === 'BANG') {
                // Blinding flash fading in and out
                if (elapsedStateTime < 0.1) {
                    flashOverlay.style.opacity = elapsedStateTime / 0.1;
                } else if (elapsedStateTime < 1.5) {
                    flashOverlay.style.opacity = 1 - ((elapsedStateTime - 0.1) / 1.4);
                } else {
                    flashOverlay.style.opacity = 0;
                    state = 'WARP';
                    stateStartTime = time;
                    warpParticles.material.opacity = 1;
                }
                
                // Expanding singularity
                galaxyParticles.scale.set(elapsedStateTime*2, elapsedStateTime*2, elapsedStateTime*2);
                galaxyParticles.material.opacity = elapsedStateTime;
            }
            else if (state === 'WARP') {
                // Space wrapping / Light year speed
                const positions = warpParticles.geometry.attributes.position.array;
                for(let i=2; i<positions.length; i+=3) {
                    positions[i] += 40; // Fast movement towards camera
                    if(positions[i] > 600) {
                        positions[i] = -1000;
                    }
                }
                warpParticles.geometry.attributes.position.needsUpdate = true;
                
                // Camera FOV warp effect
                if(camera.fov < 120) {
                    camera.fov += 1;
                    camera.updateProjectionMatrix();
                }

                // Evolve Galaxy
                galaxyParticles.scale.lerp(new THREE.Vector3(1, 1, 1), 0.05);
                galaxyParticles.rotation.y += 0.02;

                if (elapsedStateTime > 4.0) {
                    state = 'GALAXY';
                    stateStartTime = time;
                }
            }
            else if (state === 'GALAXY') {
                // Settle into Milky way
                warpParticles.material.opacity = Math.max(0, warpParticles.material.opacity - 0.02);
                
                if(camera.fov > 75) {
                    camera.fov -= 0.5;
                    camera.updateProjectionMatrix();
                }

                galaxyParticles.rotation.y += 0.005;

                // Move camera towards center
                camera.position.z = THREE.MathUtils.lerp(camera.position.z, 150, 0.02);

                if (elapsedStateTime > 5.0) {
                    state = 'SOLAR';
                    stateStartTime = time;
                    solarSystem.visible = true;
                }
            }
            else if (state === 'SOLAR') {
                // Constant space bending (Camera slight roll + FOV breathing)
                camera.rotation.z = Math.sin(time * 0.5) * 0.05;
                camera.fov = 75 + Math.sin(time * 2) * 2;
                camera.updateProjectionMatrix();

                // Fade out galaxy, zoom in
                galaxyParticles.material.opacity = Math.max(0.1, galaxyParticles.material.opacity - 0.01);
                galaxyParticles.rotation.y += 0.002;
                
                camera.position.z = THREE.MathUtils.lerp(camera.position.z, 20, 0.01);

                // Fade in and rotate planets
                planets.forEach(p => {
                    if(p.type === 'sun') {
                        p.mesh.material.opacity = Math.min(1, p.mesh.material.opacity + 0.02);
                    } else {
                        p.mat.opacity = Math.min(1, p.mat.opacity + 0.02);
                        p.pivot.rotation.y += p.speed;
                        p.mesh.rotation.y += 0.05;
                    }
                });
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
